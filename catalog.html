<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House - Menu Catalog</title>
    <link rel="icon" href="./img/svg/odigo-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header__container">
        <a href="index.html" class="logo">☕ Coffee House</a>

        <!-- Navigation -->
        <nav class="nav" id="navMenu">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html#favorites" class="nav-link">Coffee</a></li>
                <li class="nav-item"><a href="index.html#about" class="nav-link active">About Us</a></li>
                <li class="nav-item"><a href="index.html#visitus" class="nav-link">Favorites</a></li>
                <li class="nav-item"><a href="#contacts" class="nav-link">Contacts</a></li>
            </ul>
        </nav>

        <!-- Burger -->
        <div class="header-controls">
            <button id="theme-btn" aria-label="Toggle theme">🌙</button>
            <button class="burger-btn" aria-label="Open menu">☰Menu</button>
                <span></span>
                <span></span>
                <span></span>
        </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <section class="catalog">
      <div class="container">
        <h1 class="catalog-title">Behind each of our cups hides an amazing surprise</h1>

        <!-- Category -->

           <div class="categories" id="categories-container">
                <button class="cat-btn active" data-category="coffee">☕ Coffee</button>
                <button class="cat-btn" data-category="tea">🍵 Tea</button>
                <button class="cat-btn" data-category="dessert">🍰 Desserts</button>
            </div>

        <!-- Сетка карточек -->
            <div class="cards-grid" id="cards-grid">
            </div>
                <div>
                    <button id="load-more-btn" class="load-more-btn">Load More</button>
                </div>
            </div>
    </section>
  </main>

   <!-- Footer -->
    <footer id="contacts" class="footer">
        <div class="container">
            <p>Contacts: <a href="tel:+79991234567">+7 (999) 123-45-67</a> |

            789 Bean Street, Seattle, WA</a></p>

  <script src="script.js"></script>
  <script src="products.json"></script>
